name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # node --test 直接导入 .ts 数据模块，需要 23.6+/24+ 的原生类型剥离
          node-version: 24
      # withastro/action 检测到 package.json 会执行 npm install + npm run build（含 pagefind 索引）
      - run: npm test
      # withastro/action 检测到 Pages 环境会自动上传 dist 为 github-pages artifact，无需重复上传
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
